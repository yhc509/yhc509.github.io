<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 434" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#7a92ad"/>
    </marker>
  </defs>

  <!-- Accident -->
  <rect x="0" y="272" width="150" height="64" rx="10" fill="#b03a2e"/>
  <text x="75" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Accident</text>

  <line x1="152" y1="300" x2="204" y2="292" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ① Log to memory -->
  <rect x="210" y="240" width="270" height="96" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="345" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">① Log to memory</text>
  <text x="345" y="300" text-anchor="middle" font-size="14" fill="#55677d">Cause and fix → feedback memory</text>
  <text x="345" y="322" text-anchor="middle" font-size="14" fill="#55677d">Auto-injected into the next session</text>

  <!-- ① -> ② elbow -->
  <polyline points="482,288 695,288 695,232" fill="none" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="592" y="312" text-anchor="middle" font-size="14" font-style="italic" fill="#7a6f58">Same kind of issue flagged 3 times</text>

  <!-- ② Promote to a rule -->
  <rect x="560" y="130" width="270" height="96" rx="10" fill="#dcebfb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="695" y="164" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">② Promote to a rule</text>
  <text x="695" y="190" text-anchor="middle" font-size="14" fill="#55677d">Written into .claude/rules/ checklists</text>
  <text x="695" y="212" text-anchor="middle" font-size="14" fill="#55677d">Checked mechanically every review</text>

  <!-- ② -> ③ elbow -->
  <polyline points="832,178 990,178 990,122" fill="none" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="918" y="202" text-anchor="middle" font-size="14" font-style="italic" fill="#7a6f58">Rules alone don't stop it</text>

  <!-- ③ enforcement -->
  <rect x="860" y="20" width="260" height="96" rx="10" fill="#1e3a5f"/>
  <text x="990" y="54" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">③ Hook/CI enforcement</text>
  <text x="990" y="80" text-anchor="middle" font-size="14" fill="#c9d9ec">Hooks and guards block the action</text>
  <text x="990" y="102" text-anchor="middle" font-size="14" fill="#c9d9ec">Impossible to violate</text>

  <!-- ④ cleanup -->
  <rect x="210" y="376" width="910" height="48" rx="10" fill="#faf6ec" stroke="#b0a48c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="665" y="406" text-anchor="middle" font-size="15" fill="#7a6f58">④ Constant cleanup: remove stale items right away (old rules = a false-positive factory)</text>
</svg>
