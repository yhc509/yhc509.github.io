<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 434" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#7a92ad"/>
    </marker>
  </defs>

  <!-- 사고 발생 -->
  <rect x="0" y="272" width="150" height="64" rx="10" fill="#b03a2e"/>
  <text x="75" y="311" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">사고 발생</text>

  <line x1="152" y1="300" x2="204" y2="292" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ① 메모리 적립 -->
  <rect x="210" y="240" width="270" height="96" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="345" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">① 메모리 적립</text>
  <text x="345" y="300" text-anchor="middle" font-size="14" fill="#55677d">원인·회피법을 feedback 메모리로</text>
  <text x="345" y="322" text-anchor="middle" font-size="14" fill="#55677d">다음 세션에 자동 주입</text>

  <!-- ① -> ② elbow -->
  <polyline points="482,288 695,288 695,232" fill="none" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="592" y="312" text-anchor="middle" font-size="14" font-style="italic" fill="#7a6f58">같은 부류 지적 3회 반복되면</text>

  <!-- ② 룰 승격 -->
  <rect x="560" y="130" width="270" height="96" rx="10" fill="#dcebfb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="695" y="164" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">② 룰 승격</text>
  <text x="695" y="190" text-anchor="middle" font-size="14" fill="#55677d">.claude/rules/ 체크리스트 명문화</text>
  <text x="695" y="212" text-anchor="middle" font-size="14" fill="#55677d">리뷰마다 기계적 점검</text>

  <!-- ② -> ③ elbow -->
  <polyline points="832,178 990,178 990,122" fill="none" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="918" y="202" text-anchor="middle" font-size="14" font-style="italic" fill="#7a6f58">문서 룰로도 안 막히면</text>

  <!-- ③ 기계 강제 -->
  <rect x="860" y="20" width="260" height="96" rx="10" fill="#1e3a5f"/>
  <text x="990" y="54" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">③ 훅/CI 기계 강제</text>
  <text x="990" y="80" text-anchor="middle" font-size="14" fill="#c9d9ec">hook·가드가 실행 자체를 차단</text>
  <text x="990" y="102" text-anchor="middle" font-size="14" fill="#c9d9ec">어길 수 없게</text>

  <!-- ④ 상시 정리 -->
  <rect x="210" y="376" width="910" height="48" rx="10" fill="#faf6ec" stroke="#b0a48c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="665" y="406" text-anchor="middle" font-size="15" fill="#7a6f58">④ 상시 정리 — stale해진 항목은 즉시 제거 (낡은 룰 = false positive 공장)</text>
</svg>
