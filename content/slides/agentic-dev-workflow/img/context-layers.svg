<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 292" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#7a92ad"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#2a7ae2"/>
    </marker>
  </defs>

  <!-- layer 1 -->
  <rect x="0" y="10" width="700" height="56" rx="8" fill="#f4f6f8" stroke="#7a92ad" stroke-width="1.3"/>
  <text x="20" y="45" font-size="17.5" font-weight="700" fill="#334155">글로벌 CLAUDE.md</text>
  <text x="680" y="44" text-anchor="end" font-size="13.5" fill="#55677d">작업 방식 전반 · 위임 정책 · 리뷰 절차</text>

  <!-- layer 2 -->
  <rect x="45" y="76" width="655" height="56" rx="8" fill="#f4f6f8" stroke="#7a92ad" stroke-width="1.3"/>
  <text x="65" y="111" font-size="17.5" font-weight="700" fill="#334155">프로젝트 CLAUDE.md</text>
  <text x="680" y="110" text-anchor="end" font-size="13.5" fill="#55677d">아키텍처 요약 · 워크트리/이슈 워크플로</text>

  <!-- layer 3 (shared truth) -->
  <rect x="90" y="142" width="610" height="56" rx="8" fill="#dcebfb" stroke="#2a7ae2" stroke-width="2.5"/>
  <text x="110" y="177" font-size="17.5" font-weight="700" fill="#1e3a5f">.claude/rules/*</text>
  <text x="680" y="176" text-anchor="end" font-size="13.5" fill="#3d5875">모듈별 코드 규약 · 리뷰 체크리스트</text>

  <!-- layer 4 -->
  <rect x="135" y="208" width="565" height="56" rx="8" fill="#f4f6f8" stroke="#7a92ad" stroke-width="1.3"/>
  <text x="155" y="243" font-size="17.5" font-weight="700" fill="#334155">AGENTS.md</text>
  <text x="680" y="242" text-anchor="end" font-size="13.5" fill="#55677d">rules로의 포인터만 (내용 없음)</text>

  <!-- Claude Code -->
  <rect x="880" y="60" width="240" height="52" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="1000" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">Claude Code</text>

  <polyline points="878,92 780,92 780,156 706,168" fill="none" stroke="#2a7ae2" stroke-width="2" marker-end="url(#arb)"/>
  <text x="800" y="140" font-size="13" font-style="italic" fill="#2a7ae2">path-scope 자동 로드</text>

  <!-- Codex -->
  <rect x="880" y="196" width="240" height="52" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="1000" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">Codex</text>

  <line x1="878" y1="236" x2="706" y2="236" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="792" y="258" text-anchor="middle" font-size="13" font-style="italic" fill="#55677d">AGENTS.md(포인터) 읽음</text>

  <line x1="878" y1="200" x2="708" y2="177" stroke="#2a7ae2" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arb)"/>
  <text x="800" y="172" text-anchor="middle" font-size="13" font-style="italic" fill="#2a7ae2">hook이 같은 rules 주입</text>
</svg>
