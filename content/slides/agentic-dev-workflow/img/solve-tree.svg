<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 444" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#7a92ad"/>
    </marker>
  </defs>

  <!-- Q1 -->
  <rect x="20" y="16" width="380" height="64" rx="32" fill="#f4f6f8" stroke="#7a92ad" stroke-width="1.5"/>
  <text x="210" y="56" text-anchor="middle" font-size="19" font-weight="600" fill="#334155">방향 자체가 맞는지 의심돼?</text>

  <rect x="650" y="16" width="450" height="64" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="875" y="43" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">/first-principles</text>
  <text x="875" y="67" text-anchor="middle" font-size="14.5" fill="#55677d">접근법 자체를 재정의 (1원칙 사고법)</text>

  <line x1="402" y1="48" x2="645" y2="48" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="520" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#1d8348">YES</text>

  <!-- Q1 -> Q2 -->
  <line x1="210" y1="82" x2="210" y2="146" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="232" y="120" font-size="15" font-weight="700" fill="#b03a2e">NO</text>

  <!-- Q2 -->
  <rect x="20" y="150" width="380" height="64" rx="32" fill="#f4f6f8" stroke="#7a92ad" stroke-width="1.5"/>
  <text x="210" y="190" text-anchor="middle" font-size="19" font-weight="600" fill="#334155">뭘 만들지 구체적으로 정해졌어?</text>

  <rect x="650" y="150" width="450" height="64" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="875" y="177" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">/why</text>
  <text x="875" y="201" text-anchor="middle" font-size="14.5" fill="#55677d">존재론적 질문 루프 → 스펙 결정화</text>

  <line x1="402" y1="182" x2="645" y2="182" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="520" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#b03a2e">NO</text>

  <!-- Q2 -> brainstorming (elbow) -->
  <polyline points="210,216 210,300 645,300" fill="none" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>
  <text x="232" y="262" font-size="15" font-weight="700" fill="#1d8348">YES</text>

  <rect x="650" y="268" width="450" height="64" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="875" y="295" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">/brainstorming</text>
  <text x="875" y="319" text-anchor="middle" font-size="14.5" fill="#55677d">한 번에 한 질문, 설계 탐색 (HARD GATE)</text>

  <!-- separator -->
  <line x1="20" y1="356" x2="1100" y2="356" stroke="#c8d3de" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- autoloop -->
  <rect x="20" y="374" width="430" height="56" rx="28" fill="#f4f6f8" stroke="#7a92ad" stroke-width="1.5"/>
  <text x="235" y="409" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">동작하는 결과물이 있고, 수치 개선이 목표</text>

  <line x1="452" y1="402" x2="645" y2="402" stroke="#7a92ad" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="650" y="374" width="450" height="56" rx="10" fill="#eef4fb" stroke="#2a7ae2" stroke-width="1.5"/>
  <text x="875" y="397" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">/autoloop</text>
  <text x="875" y="419" text-anchor="middle" font-size="14" fill="#55677d">변형 → 측정 → 채택 자동 루프</text>
</svg>
